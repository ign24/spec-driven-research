[project]
name = "spec-driven-research"
dynamic = ["version"]
description = "Deterministic lifecycle and evidence gates for Spec-Driven Research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Ignacio Zúñiga Navarro" },
]
keywords = [
    "evidence",
    "research",
    "research-automation",
    "spec-driven-development",
    "traceability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
snapshot = [
    "trafilatura>=1.12",
]

[project.scripts]
sdr = "sdr.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "ruff>=0.6",
    "twine>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr"]

[tool.hatch.build.targets.wheel.force-include]
"skills/sdr-explore/SKILL.md" = "sdr/resources/skills/sdr-explore/SKILL.md"
"skills/sdr-intake/SKILL.md" = "sdr/resources/skills/sdr-intake/SKILL.md"
"skills/sdr-new/SKILL.md" = "sdr/resources/skills/sdr-new/SKILL.md"
"skills/sdr-probe/SKILL.md" = "sdr/resources/skills/sdr-probe/SKILL.md"
"skills/sdr-reuse/SKILL.md" = "sdr/resources/skills/sdr-reuse/SKILL.md"
"skills/sdr-status/SKILL.md" = "sdr/resources/skills/sdr-status/SKILL.md"
"skills/sdr-transfer/SKILL.md" = "sdr/resources/skills/sdr-transfer/SKILL.md"
"integrations/claude-code/adapter.yaml" = "sdr/resources/integrations/claude-code/adapter.yaml"
"integrations/codex/adapter.yaml" = "sdr/resources/integrations/codex/adapter.yaml"
"integrations/opencode/adapter.yaml" = "sdr/resources/integrations/opencode/adapter.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["/bench", "/openspec/changes", "/.codegraph"]

[tool.hatch.version]
path = "src/sdr/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
