name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m sdr.readme_parity .
      - run: uv run python -m sdr.skill_validation .
      - run: uv run python -m sdr.integration_validation validate .
      - run: npm install --global @fission-ai/openspec@1.2.0
      - run: openspec validate --specs --strict --no-interactive
      - name: Validate workflow syntax
        # v1.7.7, tag commit 03d0035246f3e81f36aed592ffb4bebf33a03106.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  package:
    name: Build and inspect distributions
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
      - run: uv sync --locked --all-extras --dev
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv run python -m sdr.artifact_audit dist/*
      - name: Isolated wheel and sdist smoke tests
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for artifact in dist/*; do
            index=$((index + 1))
            environment="$RUNNER_TEMP/artifact-$index"
            workspace="$RUNNER_TEMP/smoke-$index"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            mkdir "$workspace"
            (
              cd "$workspace"
              "$environment/bin/python" -I -c "from importlib.resources import files; import sdr; assert files('sdr').joinpath('templates/brief.md').is_file()"
              "$environment/bin/sdr" --help
              SDR_ROOT="$workspace/research" "$environment/bin/sdr" new artifact-smoke --title Smoke --question "Does the installed artifact run?" --no-commit
              SDR_ROOT="$workspace/research" "$environment/bin/sdr" status artifact-smoke --json
            )
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
