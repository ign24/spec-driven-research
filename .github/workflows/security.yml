name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.24.x"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4
        with:
          version: "0.10.2"
      - run: uv sync --locked --all-extras --dev
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit public tree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run python -m sdr.public_tree_audit .
          --exclude .git --exclude .venv --exclude .pytest_cache --exclude .ruff_cache
          --exclude build --exclude dist --exclude examples/__pycache__
          --exclude src/sdr/__pycache__ --exclude tests/__pycache__
          --exclude bench/__pycache__ --exclude bench/harness/__pycache__
      - name: Install official Gitleaks CLI
        # v8.28.0, tag commit 39fdb480a06768cc41a84ef86959c07ff33091c4.
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan working tree with redacted output
        run: gitleaks dir --redact --no-banner .
      - name: Scan complete Git history with redacted output
        run: gitleaks git --redact --no-banner --log-opts="--all" .
      - name: Scan staged patch with redacted output
        shell: bash
        run: git diff --cached --binary | gitleaks --redact --no-banner stdin
      - run: uv build
      - name: Audit and secret-scan built artifacts
        run: |
          uv run python -m sdr.artifact_audit dist/*
          gitleaks dir --redact --no-banner --max-archive-depth=1 dist
