    stage: transfer
    ring: assess
    audience: equipo
    evidence_claim_ids:
      - claim-0c17386d97c8104dc079fd79ea40d20d0fb8e356c32281d22ebc20880b7bf4ac
      - claim-cc77a769d42ee59226d4550ad133996ed4fac3b0c455de7e3770eefa35780ab6
    ---

    ## Recomendación
    En el contexto de los despachadores inventados, ante cifras publicadas sin configuración,
    decidimos evaluar el despachador de la ficha para lograr una comparación de caudal,
    porque la evidencia citada es de primera mano, aceptando el trade-off de que la cifra
    no puede verificarse de forma independiente.

    ## Alternativas evaluadas
    Despachador con ficha de rendimiento y despachador con configuración publicada.

    ## Criterios de selección
    Atribución de cada cifra y disponibilidad de la configuración de prueba.

    ## Riesgos y limitaciones
    Ninguna verificación determinista distingue una cita exacta de una fuente inexacta.

    ## Próximos pasos
    Reproducir la cifra con una medición propia antes de usarla en cualquier comparación.

    ## Audiencia
    Equipo ficticio de plataforma interna.
  uncaught-inaccurate-source-throughput/assets/playbook.md: |
