    ---

    ## Alternativas evaluadas
    El despachador sostiene cuarenta mil mensajes por segundo en un solo nodo [S1].

    ## Madurez
    La ficha de primera mano se publica junto con la documentación del producto [cf. S1].

    ## Costos
    El despachador alternativo publica su configuración de prueba completa [S2].

    ## Riesgos
    La cifra citada se reproduce con exactitud aunque nadie la haya medido nunca.

    ## Contra-evidencia
    Las cifras sin configuración declarada no pueden compararse entre despachadores [cf. S2].
  uncaught-inaccurate-source-throughput/decision-memo.md: |
    ---
    research: uncaught-inaccurate-source-throughput
