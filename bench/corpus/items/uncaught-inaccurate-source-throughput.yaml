    stage: reuse
    type: playbook
    audience: internal
    ---

    # Leer cifras de rendimiento publicadas

    1. Exigir la configuración de prueba junto con cada cifra.
    2. Recordar que una cita exacta no vuelve exacta a la fuente.
    3. Reproducir la cifra antes de compararla con otra.

