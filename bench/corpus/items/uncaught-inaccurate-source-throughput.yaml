id: uncaught-inaccurate-source-throughput
mode: light
title: Fuente inventada con una cifra de rendimiento inexacta
question: >-
  ¿Qué caudal sostiene el despachador inventado según sus fuentes de primera mano?
planted_defects:
  - inaccurate-source
expected_detection:
  inaccurate-source: uncaught
notes: >-
  Planted defect no current control is expected to catch. The note quotes its source
  literally, so textual anchoring resolves the claim; the source is declared T1, current,
  reachable and triangulated, so every evidential check passes. The defect is that the
  source itself is wrong: the figure it publishes was never measured. docs/evidence-model.md
  states this boundary explicitly under Confidence boundaries: a passing gate does not mean
  a source is accurate. Scoring this item as `uncaught` is what keeps the harness from
  reporting a perfect detection rate by construction.

