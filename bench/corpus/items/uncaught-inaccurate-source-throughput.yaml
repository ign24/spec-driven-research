  uncaught-inaccurate-source-throughput/brief.md: |
    ---
    research: uncaught-inaccurate-source-throughput
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 2
    ---

    ## Pregunta
    ¿Qué caudal sostiene el despachador inventado según sus fuentes de primera mano?

    ## Hipótesis
    Las fichas de primera mano bastarán para comparar el caudal de los dos despachadores.

    ## Contexto
    El escenario es inventado y no describe ningún despachador ni ninguna medición real.

    ## Alcance
    Incluye dos despachadores inventados. No incluye hardware, red real ni producción.

    ## Criterios de evaluación
    - C1: cada cifra de caudal se atribuye a una fuente citada.
    - C2: cada cifra de caudal declara la configuración con la que se obtuvo.

    ## Riesgos de adopción
    Una cifra publicada sin configuración puede ser exacta en la cita e inexacta en el fondo.
