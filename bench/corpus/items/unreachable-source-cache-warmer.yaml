    # Revisar fuentes irrecuperables

    1. Verificar que cada fuente declarada siga siendo alcanzable.
    2. Marcar como incompleta toda comparación que dependa de una fuente perdida.
    3. Reemplazar la fuente antes de subir el anillo de la recomendación.

