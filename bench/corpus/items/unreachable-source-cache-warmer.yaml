id: unreachable-source-cache-warmer
mode: light
title: Precalentador inventado de caché con una fuente inalcanzable
question: >-
  ¿Conviene precalentar una caché inventada al iniciar el proceso o al primer pedido?
planted_defects:
  - unreachable-source
expected_detection:
  unreachable-source: caught
notes: >-
  Planted defect: source S2 is unreachable by construction. Its host ends in the `.invalid`
  top-level domain, which RFC 6761 reserves as guaranteed never to resolve, so the source
  cannot become reachable through any DNS or hosting change and the item never depends on
  an external site failing. S2 carries no snapshot, exactly as an unretrievable source
  would. S2 is cited only with `[cf. S2]`, so the planted defect stays a reachability
  failure and does not turn into an anchoring failure as well. The control that reports it
  is `links_resolve` on the explore stage, so the item runs an explicit
  `check --stage explore`. Offline that control is skipped, never passed, so an offline
  replay must score this defect as not exercised rather than as missed.

