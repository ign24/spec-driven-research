        alternative: precalentado
      - id: S2
        url: https://archivo.cache-warmer.invalid/nota-2026
        tier: T3
        date: 2026-05-15
        alternative: precalentado
    ---

    ## Alternatives evaluated
    Se comparan el precalentado en el arranque y el precalentado perezoso [cf. S1].
    Una nota de taller archivada describía una tercera variante intermedia [cf. S2].

    ## Maturity
    El precalentado en el arranque agrega una espera fija antes de aceptar pedidos [S1].

    ## Costs
    El costo declarado por la nota archivada ya no puede reconstruirse desde la fuente [cf. S2].

    ## Risks
    La estrategia perezosa concentra la espera en usuarios reales del primer pedido.

    ## Counter-evidence
    La única contra-evidencia disponible provenía de la nota archivada y hoy es irrecuperable.
  unreachable-source-cache-warmer/decision-memo.md: |
    ---
    research: unreachable-source-cache-warmer
    date: 2026-07-21
    stage: transfer
    ring: assess
    audience: equipo
    evidence_claim_ids:
      - claim-0c2dab30fac3bdd962061789a6fa837fa57bbbcab5dd0bbf4b28fcafd8a9f7c5
    ---

    ## Recommendation
    In the context of the invented warmup, faced with a source that is no longer
    retrievable, we decided to assess warming at startup to obtain a predictable wait,
    because the retrievable evidence covers only that strategy, accepting the trade-off of
    relying on a single verifiable source.

    ## Alternatives evaluated
    Precalentado en el arranque y precalentado perezoso al primer pedido.

    ## Selection criteria
    Momento en el que se paga la espera y disponibilidad de evidencia verificable.

    ## Risks and limitations
    Una de las dos fuentes es irrecuperable, así que la comparación queda incompleta.

    ## Next steps
    Reemplazar la fuente irrecuperable antes de cualquier decisión de adopción.

    ## Audience
    Equipo ficticio de plataforma interna.
