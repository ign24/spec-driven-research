    ---
    research: unreachable-source-cache-warmer
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 2
    ---

    ## Pregunta
    ¿Conviene precalentar una caché inventada al iniciar el proceso o al primer pedido?

    ## Hipótesis
    El precalentado en el arranque reducirá la latencia percibida del primer pedido.

    ## Contexto
    El escenario es inventado y no describe ningún sistema real ni ninguna organización real.

    ## Alcance
    Incluye dos estrategias de precalentado. No incluye invalidación, red real ni producción.

    ## Criterios de evaluación
    - C1: la estrategia elegida define cuándo se paga la espera de precalentado.
    - C2: cada estrategia declara al menos una fuente consultable.

    ## Riesgos de adopción
    Una de las fuentes consultadas ya no es recuperable, lo que debilita la trazabilidad.
