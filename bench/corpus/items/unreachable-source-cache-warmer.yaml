    evidence_claim_ids:
      - claim-0c2dab30fac3bdd962061789a6fa837fa57bbbcab5dd0bbf4b28fcafd8a9f7c5
    ---

    ## Recomendación
    En el contexto del precalentado inventado, ante una fuente que ya no es recuperable,
    decidimos evaluar el precalentado en el arranque para lograr una espera predecible,
    porque la evidencia recuperable solo cubre esa estrategia, aceptando el trade-off de
    apoyarnos en una única fuente verificable.

    ## Alternativas evaluadas
    Precalentado en el arranque y precalentado perezoso al primer pedido.

    ## Criterios de selección
    Momento en el que se paga la espera y disponibilidad de evidencia verificable.

    ## Riesgos y limitaciones
    Una de las dos fuentes es irrecuperable, así que la comparación queda incompleta.

    ## Próximos pasos
    Reemplazar la fuente irrecuperable antes de cualquier decisión de adopción.

    ## Audiencia
    Equipo ficticio de plataforma interna.
