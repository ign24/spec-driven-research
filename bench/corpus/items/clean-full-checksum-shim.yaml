        alternative: adaptador-local
    ---

    ## Alternatives evaluated
    El ejercicio compara un adaptador local con una biblioteca externa inventada [cf. S2].
    El adaptador recorre las cadenas en orden y devuelve una suma estable [S1].

    ## Maturity
    Ambas alternativas alcanzan para una demostración de capacitación [cf. S1].

    ## Costs
    La biblioteca externa agrega una dependencia de compilación por plataforma [S2].

    ## Risks
    El conjunto fijo de entradas puede ocultar diferencias de rendimiento entre alternativas.

    ## Counter-evidence
    No se encontró evidencia en contra dentro de las dos fuentes inventadas declaradas.
  clean-full-checksum-shim/probe/check.py: |
    def checksum(value: str) -> int:
        return sum(index * ord(char) for index, char in enumerate(value.strip(), start=1))


    inputs = ["alfa", "beta", "gamma"]
    first = [checksum(value) for value in inputs]
    second = [checksum(value) for value in inputs]
    assert first == second
    assert all(total > 0 for total in first)
    print("CHECKSUM_SHIM_OK")
