  clean-full-checksum-shim/brief.md: |
    ---
    research: clean-full-checksum-shim
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 3
    ---

    ## Question
    ¿Un adaptador local puede verificar sumas de tres cadenas inventadas de forma repetible?

    ## Hypothesis
    Una función pequeña producirá la misma suma para las mismas entradas inventadas.

    ## Context
    El ejercicio demuestra una prueba ejecutable sin red ni dependencias adicionales.

    ## Scope
    Incluye tres cadenas inventadas. No incluye archivos de usuario, red ni producción.

    ## Evaluation criteria
    - C1: las tres cadenas producen la suma esperada.
    - C2: dos ejecuciones consecutivas producen exactamente el mismo marcador.

    ## Adoption risks
    Tres cadenas inventadas no representan el volumen ni la variedad de un sistema real.
