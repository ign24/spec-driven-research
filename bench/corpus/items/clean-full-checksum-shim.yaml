    # Probe portable de verificación

    1. Usar únicamente datos inventados y embebidos en el propio artefacto.
    2. Declarar una acción explícita y un vector de argumentos.
    3. Esperar un marcador determinista y volver a ejecutarlo para confirmarlo.

