    ## Results by criterion
    | criterio | resultado | evidencia |
    |---|---|---|
    | C1 | cumple: las tres sumas coinciden con lo esperado | `probe/check.py` |
    | C2 | cumple: dos ejecuciones producen el mismo marcador | `probe/check.py` |

    ## Reproduction
    ```bash
    python check.py
    ```
