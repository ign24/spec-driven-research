      - claim-3f83a75e16e40346a3551eacb22e505f4a0f4999158375f58ec3afab9fc347d6
    ---

    ## Recommendation
    In the context of the invented checksum exercise, faced with the need for executable
    evidence, we decided to trial the local adapter to obtain repeatable verifications,
    because the deterministic probe met C1 and C2, accepting the trade-off that three
    invented strings do not represent production.

    ## Alternatives evaluated
    Adaptador local sobre la biblioteca estándar y biblioteca externa inventada.

    ## Selection criteria
    Repetibilidad exacta del marcador y ausencia de dependencias de compilación.

    ## Risks and limitations
    No se midieron volúmenes grandes, entradas hostiles ni integración con otros sistemas.

    ## Next steps
    Conservar el probe como demostración portable y no extrapolar su resultado.

    ## Audience
    Equipo ficticio de capacitación interna.
