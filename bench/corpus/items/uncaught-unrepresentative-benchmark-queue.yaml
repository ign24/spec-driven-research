    | criterio | resultado | evidencia |
    |---|---|---|
    | C1 | cumple: los tres mensajes salen en orden de entrada | `probe/check.py` |
    | C2 | cumple: dos ejecuciones devuelven la misma secuencia | `probe/check.py` |

    ## Reproduction
