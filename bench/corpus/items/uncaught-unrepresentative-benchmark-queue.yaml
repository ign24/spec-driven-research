    ## Recomendación
    En el contexto de la cola inventada, ante la necesidad de evidencia ejecutable,
    decidimos probar la cola en memoria para lograr un orden previsible, porque el probe
    determinista cumplió C1 y C2, aceptando el trade-off de que la prueba usa un único
    productor y no representa la carga concurrente de la pregunta.

    ## Alternativas evaluadas
    Cola en memoria de un proceso y cola con varios productores simultáneos.

    ## Criterios de selección
    Orden de salida observado y repetibilidad exacta de la ejecución.

    ## Riesgos y limitaciones
    El probe no ejerce concurrencia, así que no responde la pregunta del brief.

    ## Próximos pasos
    Escribir una medición con varios productores antes de sostener cualquier garantía.

    ## Audiencia
    Equipo ficticio de plataforma interna.
