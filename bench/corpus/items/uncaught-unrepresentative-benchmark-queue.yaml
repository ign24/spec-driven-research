    ## Alternatives evaluated
    La cola preserva el orden de llegada dentro de un mismo productor [S1].

    ## Maturity
    La documentación inventada cubre el caso de un solo productor [cf. S1].

    ## Costs
    Las pruebas de un solo productor no observan condiciones de carrera [S2].

    ## Risks
    El probe disponible mide un escenario más simple que el de la pregunta del brief.

    ## Counter-evidence
    La medición concurrente exige varios productores y repeticiones [cf. S2].
  uncaught-unrepresentative-benchmark-queue/probe/check.py: |
    from collections import deque


    def drain(messages: list[str]) -> list[str]:
        queue: deque[str] = deque()
        for message in messages:
            queue.append(message)
        return [queue.popleft() for _ in range(len(queue))]


    messages = ["alfa", "beta", "gamma"]
    assert drain(messages) == messages
    assert drain(messages) == drain(messages)
    print("QUEUE_ORDER_OK")
