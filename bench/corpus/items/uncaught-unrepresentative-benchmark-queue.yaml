    # Revisar la representatividad de un probe

    1. Releer la pregunta del brief antes de leer el resultado del probe.
    2. Comprobar que el escenario medido contenga la condición preguntada.
    3. Declarar como no respondida toda pregunta que el probe no ejerza.

