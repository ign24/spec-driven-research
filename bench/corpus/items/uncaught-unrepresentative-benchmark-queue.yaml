id: uncaught-unrepresentative-benchmark-queue
mode: full
title: Probe inventado que pasa sin representar el criterio
question: >-
  ¿La cola inventada mantiene el orden de los mensajes bajo carga concurrente?
planted_defects:
  - unrepresentative-benchmark
expected_detection:
  unrepresentative-benchmark: uncaught
notes: >-
  Planted defect no current control is expected to catch. The probe declares an explicit
  action, an argv, a matching expectation, and a result for every criterion, so executable
  and evidential validation pass. The defect is that the benchmark answers a different
  question from the one the brief asks: the question is about concurrent load and the probe
  enqueues three messages from a single thread. docs/evidence-model.md states this boundary
  under Confidence boundaries: a passing gate does not mean a benchmark is representative.

