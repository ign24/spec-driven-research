    ```
  uncaught-unrepresentative-benchmark-queue/decision-memo.md: |
    ---
    research: uncaught-unrepresentative-benchmark-queue
    date: 2026-07-22
    stage: transfer
    ring: trial
    audience: equipo
    evidence_claim_ids:
      - claim-328d73e24588765d5c4047853e28ec8c293662269660e6219f66adb6108c5139
      - claim-58d98835f8a21df465702710078c12cac3d84f1e7042300068186f475d2464b7
    ---

    ## Recommendation
    In the context of the invented queue, faced with the need for executable evidence,
    we decided to trial the in-memory queue to obtain predictable ordering, because the
    deterministic probe met C1 and C2, accepting the trade-off that the test uses a single
    producer and does not represent the concurrent load of the question.

    ## Alternatives evaluated
    Cola en memoria de un proceso y cola con varios productores simultáneos.

    ## Selection criteria
    Orden de salida observado y repetibilidad exacta de la ejecución.

    ## Risks and limitations
    El probe no ejerce concurrencia, así que no responde la pregunta del brief.

    ## Next steps
    Escribir una medición con varios productores antes de sostener cualquier garantía.

    ## Audience
    Equipo ficticio de plataforma interna.
