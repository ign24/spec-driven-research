  uncaught-unrepresentative-benchmark-queue/brief.md: |
    ---
    research: uncaught-unrepresentative-benchmark-queue
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 3
    ---

    ## Pregunta
    ¿La cola inventada mantiene el orden de los mensajes bajo carga concurrente?

    ## Hipótesis
    La cola preservará el orden de llegada incluso con varios productores simultáneos.

    ## Contexto
    El escenario es inventado y no describe ninguna cola ni ninguna medición real.

    ## Alcance
    Incluye una cola inventada en memoria. No incluye red, persistencia ni producción.

    ## Criterios de evaluación
    - C1: los mensajes salen en el mismo orden en que entraron.
    - C2: el resultado se repite de forma idéntica en dos ejecuciones.

    ## Riesgos de adopción
    Una prueba de un solo productor puede pasar sin decir nada sobre carga concurrente.
