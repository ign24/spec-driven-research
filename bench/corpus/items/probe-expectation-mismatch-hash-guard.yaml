    # Declarar expectativas de probe

    1. Copiar el marcador desde la salida real del comando, no desde la memoria.
    2. Ejecutar el probe antes de escribir la tabla de resultados.
    3. Tratar toda expectativa que no coincide como resultado no verificado.

