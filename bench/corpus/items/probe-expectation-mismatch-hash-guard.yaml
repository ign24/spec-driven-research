    ## Recomendación
    En el contexto de la guarda inventada, ante la necesidad de evidencia ejecutable,
    decidimos probar la guarda local para lograr detección repetible de cambios, porque
    el probe declarado cubre C1 y C2, aceptando el trade-off de que el fixture es diminuto.

    ## Alternativas evaluadas
    Guarda local sobre la biblioteca estándar y guarda externa con servicio adicional.

    ## Criterios de selección
    Detección de cambios y ausencia de servicios adicionales en ejecución.

    ## Riesgos y limitaciones
    El marcador declarado en el probe no es el que imprime el comando declarado.

    ## Próximos pasos
    Alinear la expectativa del probe con la salida real antes de repetir la verificación.

    ## Audiencia
    Equipo ficticio de capacitación interna.
