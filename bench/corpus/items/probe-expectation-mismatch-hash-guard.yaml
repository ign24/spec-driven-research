    ## Resultados por criterio
    | criterio | resultado | evidencia |
    |---|---|---|
    | C1 | cumple: el cambio de una cadena altera la suma | `probe/check.py` |
    | C2 | cumple: la guarda imprime su marcador final | `probe/check.py` |

    ## Reproducción
    ```bash
    python check.py
    ```
