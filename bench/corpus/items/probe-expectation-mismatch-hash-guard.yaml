id: probe-expectation-mismatch-hash-guard
mode: full
title: Guarda de hash inventada cuya expectativa no coincide con su comando
question: >-
  ¿Una guarda local puede detectar cambios en tres cadenas inventadas de forma repetible?
planted_defects:
  - probe-expectation-mismatch
expected_detection:
  probe-expectation-mismatch: caught
notes: >-
  Planted defect: the probe declares `expect: HASH_GUARD_OK` while the command it declares
  prints `HASH_GUARD_DONE`. The command succeeds and exits zero, so the mismatch is not an
  execution failure: the declared expectation simply does not describe the declared command.
  The marker is neither a substring nor a regular-expression match of the output, so the
  mismatch is unambiguous. Every other artifact of the item is complete and consistent.

