        alternative: guarda-local
    ---

    ## Alternativas evaluadas
    Se comparan una guarda local y una guarda externa inventada [cf. S2].
    La guarda imprime un marcador único al terminar sin diferencias [S1].

    ## Madurez
    Ambas guardas alcanzan para una demostración de capacitación [cf. S1].

    ## Costos
    La guarda externa requiere un servicio adicional en ejecución [S2].

    ## Riesgos
    Un marcador declarado con otro nombre invalida la lectura del resultado del probe.

    ## Contra-evidencia
    No se encontró evidencia en contra dentro de las dos fuentes inventadas declaradas.
  probe-expectation-mismatch-hash-guard/probe/check.py: |
    def digest(value: str) -> int:
        return sum(ord(char) for char in value.strip())


    baseline = ["alfa", "beta", "gamma"]
    changed = ["alfa", "beta", "gamma!"]
    assert [digest(value) for value in baseline] != [digest(value) for value in changed]
    assert [digest(value) for value in baseline] == [digest(value) for value in baseline]
    print("HASH_GUARD_DONE")
