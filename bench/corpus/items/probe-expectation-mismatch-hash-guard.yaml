  probe-expectation-mismatch-hash-guard/brief.md: |
    ---
    research: probe-expectation-mismatch-hash-guard
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 3
    ---

    ## Pregunta
    ¿Una guarda local puede detectar cambios en tres cadenas inventadas de forma repetible?

    ## Hipótesis
    Una guarda pequeña detectará cualquier cambio en las cadenas inventadas del fixture.

    ## Contexto
    El ejercicio es sintético y solo usa cadenas inventadas embebidas en el propio artefacto.

    ## Alcance
    Incluye tres cadenas inventadas. No incluye archivos de usuario, red ni producción.

    ## Criterios de evaluación
    - C1: la guarda detecta el cambio de una de las tres cadenas.
    - C2: la guarda imprime el marcador declarado al terminar sin diferencias.

    ## Riesgos de adopción
    Una expectativa mal declarada puede dar por válida una verificación que nunca coincidió.
