  contradictory-sources-retry-window/brief.md: |
    ---
    research: contradictory-sources-retry-window
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 2
    ---

    ## Pregunta
    ¿Conviene una ventana de reintentos fija o exponencial para un cliente inventado?

    ## Hipótesis
    El retroceso exponencial dispersará mejor los intentos que una ventana fija.

    ## Contexto
    El escenario es inventado y no describe ningún cliente ni ninguna medición real.

    ## Alcance
    Incluye dos estrategias de reintento. No incluye red real, cuotas ni producción.

    ## Criterios de evaluación
    - C1: cada alternativa declara al menos una fuente de primera mano.
    - C2: las fuentes citadas coinciden sobre el comportamiento de la ventana fija.

    ## Riesgos de adopción
    Fuentes que se contradicen pueden sostener cualquiera de las dos recomendaciones.
