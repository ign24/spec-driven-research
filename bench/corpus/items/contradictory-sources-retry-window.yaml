      Medición de ventana fija

      La ventana fija mantiene un intervalo constante entre intentos.
      El conjunto de pruebas usa clientes sintéticos y un servidor simulado.
  - id: S3
    url: https://docs.ventana-abierta.example/reintentos/exponencial
    title: Manual de reintentos de Ventana Abierta
    tier: T1
    date: "2026-05-27"
