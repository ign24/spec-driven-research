      Manual de reintentos

      La ventana fija produce ráfagas sincronizadas de reintentos.
      El retroceso exponencial dispersa los intentos a lo largo del tiempo.
  - id: S4
    url: https://bench.taller-etiquetas.test/reintentos/exponencial
    title: Medición de retroceso exponencial del Taller de Etiquetas
    tier: T2
    date: "2026-06-11"
    snapshot: |
      Medición de retroceso exponencial

      Los clientes con ventana fija reintentaron todos en el mismo instante.
      El retroceso exponencial redujo la cantidad de intentos simultáneos.

