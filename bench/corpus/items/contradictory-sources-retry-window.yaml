    stage: reuse
    type: playbook
    audience: internal
    ---

    # Arbitrar fuentes contradictorias

    1. Escribir las dos afirmaciones opuestas una al lado de la otra.
    2. No elegir alternativa mientras la contradicción siga sin arbitrar.
    3. Diseñar una medición propia que resuelva la diferencia.

