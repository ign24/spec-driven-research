        tier: T2
        date: 2026-06-11
        alternative: retroceso-exponencial
    ---

    ## Alternativas evaluadas
    La ventana fija elimina las ráfagas de reintentos sincronizados [S1].
    La ventana fija produce ráfagas sincronizadas de reintentos [S3].

    ## Madurez
    El retroceso exponencial dispersa los intentos a lo largo del tiempo [cf. S3].

    ## Costos
    La ventana fija mantiene un intervalo constante entre intentos [S2].

    ## Riesgos
    Las dos fuentes de primera mano describen el mismo comportamiento de forma opuesta.

    ## Contra-evidencia
    Los clientes con ventana fija reintentaron todos en el mismo instante [S4].
  contradictory-sources-retry-window/decision-memo.md: |
    ---
    research: contradictory-sources-retry-window
    date: 2026-07-21
    stage: transfer
    ring: assess
    audience: equipo
    evidence_claim_ids:
      - claim-f4dacf658455a998cb2f52990e731c08d91f821af896aba657206fc0c6964f3d
      - claim-4b69ceda873fa93926d734742e2af6827f841ff4ea45f84d91c672bbbe05db28
      - claim-5e16fce5574e68535358135ebf78ef5c0617573d586e0c05d717cef5966edfa1
      - claim-b06f1276799615fb3649cfa928e56750deb6af3354516efa8f529d011e5e3c83
    ---

    ## Recomendación
    En el contexto del cliente inventado, ante fuentes de primera mano que se contradicen,
    decidimos evaluar el retroceso exponencial para lograr intentos dispersos, porque la
    evidencia disponible no permite decidir sobre la ventana fija, aceptando el trade-off
    de dejar abierta una contradicción documental.

    ## Alternativas evaluadas
    Ventana de reintentos fija y retroceso exponencial.

    ## Criterios de selección
    Dispersión de los intentos y consistencia entre las fuentes citadas.

    ## Riesgos y limitaciones
    Dos fuentes T1 sostienen afirmaciones opuestas y ninguna medición propia las arbitra.

    ## Próximos pasos
    Diseñar un probe propio que decida la contradicción antes de subir el anillo.

    ## Audiencia
    Equipo ficticio de plataforma interna.
