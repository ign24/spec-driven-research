id: contradictory-sources-retry-window
mode: light
title: Ventana de reintentos inventada con fuentes que se contradicen
question: >-
  ¿Conviene una ventana de reintentos fija o exponencial para un cliente inventado?
planted_defects:
  - contradictory-sources
expected_detection:
  contradictory-sources: uncaught
notes: >-
  Planted defect: the sources contradict each other across the two alternatives. S1 states
  that the fixed window removes retry bursts; S3 and S4 state that the fixed window
  produces synchronized retry bursts. Every claim is anchored in its own snapshot, every
  alternative has a T1 source and two independent invented organizations, and the dates are
  current, so every structural and evidential check passes while the evidence disagrees with
  itself. Replaying the whole light lifecycle offline confirms it: every command exits zero
  and the investigation reaches `reuse` with the contradiction intact, so the expectation is
  recorded as `uncaught`. No control compares the content of two sources against each other.

