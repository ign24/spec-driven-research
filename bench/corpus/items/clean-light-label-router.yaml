      - id: S2
        url: https://bench.taller-etiquetas.test/comparativa
        tier: T2
        date: 2026-06-02
        alternative: enrutador-local
    ---

    ## Alternativas evaluadas
    El espacio inventado compara un enrutador local con una tabla estática [cf. S2].
    El enrutador declara tres categorías fijas y no admite categorías dinámicas [S1].

    ## Madurez
    Ambas alternativas se consideran suficientes para un ejercicio de capacitación [cf. S1].

    ## Costos
    La tabla estática exige mantenimiento manual por cada categoría nueva [S2].

    ## Riesgos
    Un conjunto fijo de reglas puede favorecer accidentalmente a una de las alternativas.

    ## Contra-evidencia
    No se buscó evidencia en contra fuera de las dos fuentes inventadas declaradas arriba.
  clean-light-label-router/decision-memo.md: |
    ---
    research: clean-light-label-router
