  clean-light-label-router/brief.md: |
    ---
    research: clean-light-label-router
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 2
    ---

    ## Pregunta
    ¿Un enrutador local puede asignar tres categorías inventadas de forma estable sin red?

    ## Hipótesis
    Un conjunto de reglas ordenadas devolverá la misma categoría para las mismas entradas.

    ## Contexto
    El ejercicio es sintético y solo usa cadenas inventadas embebidas en el propio artefacto.

    ## Alcance
    Incluye tres categorías inventadas. No incluye red, persistencia, idiomas ni producción.

    ## Criterios de evaluación
    - C1: las tres entradas del fixture producen la categoría esperada.
    - C2: dos ejecuciones consecutivas producen exactamente la misma salida.

    ## Riesgos de adopción
    El fixture es diminuto y no representa la variedad de etiquetas de un sistema real.
