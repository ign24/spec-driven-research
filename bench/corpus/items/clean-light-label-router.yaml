    audience: equipo
    evidence_claim_ids:
      - claim-f2316e8bc99e1aedc4430d7d07b1e8f40c7379f53e51481b0e420c32a77428c4
      - claim-adb9d4f58d5cab7e806965b9053f3fc2f543a1b7952a64537f6eba5a3b0bf120
    ---

    ## Recomendación
    En el contexto del ejercicio de etiquetas inventadas, ante la falta de una prueba
    ejecutable en modo light, decidimos evaluar el enrutador local para lograr salidas
    estables, porque la evidencia declarada cubre C1 y C2 solo de forma documental,
    aceptando el trade-off de no contar con resultados reproducibles.

    ## Alternativas evaluadas
    Enrutador local con reglas ordenadas y tabla estática mantenida a mano.

    ## Criterios de selección
    Estabilidad de la salida y costo de mantenimiento por categoría nueva.

    ## Riesgos y limitaciones
    No se midió rendimiento, no se probó con entradas hostiles y no hubo etapa probe.

    ## Próximos pasos
    Conservar el ejercicio como fixture de referencia y no extrapolar su resultado.

    ## Audiencia
    Equipo ficticio de capacitación interna.
