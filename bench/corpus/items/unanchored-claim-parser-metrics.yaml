        alternative: analizador-de-registros
    ---

    ## Alternativas evaluadas
    Se comparan un analizador de un solo recorrido y uno de dos pasadas [cf. S1].

    ## Madurez
    El analizador reduce a la mitad el tiempo de análisis en cargas mixtas [S1].

    ## Costos
    El analizador de dos pasadas separa la validación del cálculo [S2].

    ## Riesgos
    Adoptar una cifra sin respaldo documental puede sesgar la comparación completa.

    ## Contra-evidencia
    La documentación consultada no publica tiempos por tipo de carga [cf. S1].
  unanchored-claim-parser-metrics/decision-memo.md: |
    ---
    research: unanchored-claim-parser-metrics
    date: 2026-07-21
    stage: transfer
    ring: assess
    audience: equipo
    evidence_claim_ids:
      - claim-93ab6a0a3d56dd00a7a40de056c8decdb79d5dcae3ed33d6b250607cfffe0f1f
    ---

    ## Recomendación
    En el contexto de los analizadores inventados, ante una cifra de mejora sin respaldo,
    decidimos evaluar el analizador de un solo recorrido para lograr una comparación
    honesta, porque la evidencia citada no sostiene la mejora declarada, aceptando el
    trade-off de posponer cualquier afirmación cuantitativa.

    ## Alternativas evaluadas
    Analizador de un solo recorrido y analizador de dos pasadas.

    ## Criterios de selección
    Respaldo documental de cada cifra y disponibilidad de fuentes de primera mano.

    ## Riesgos y limitaciones
    La cifra de mejora del cincuenta por ciento no aparece en ninguna fuente citada.

    ## Próximos pasos
    Medir el tiempo de análisis con un probe propio antes de repetir la cifra.

    ## Audiencia
    Equipo ficticio de plataforma interna.
