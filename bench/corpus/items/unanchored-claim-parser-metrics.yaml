id: unanchored-claim-parser-metrics
mode: light
title: Analizador inventado de registros con una cita sin anclaje
question: >-
  ¿Un analizador de un solo recorrido mejora el tiempo de análisis de registros inventados?
planted_defects:
  - unanchored-claim
expected_detection:
  unanchored-claim: caught
notes: >-
  Planted defect: the note states a factual claim ending in `[S1]` that the snapshot of S1
  does not contain. The snapshot exists, is plausible and does support other statements of
  the note, so the failure is semantic rather than a missing snapshot: the claim sentence
  "El analizador reduce a la mitad el tiempo de análisis en cargas mixtas." never appears
  in the snapshot text, so exact normalized matching cannot recover it. The halving figure
  is invented by the note, not by the source.

