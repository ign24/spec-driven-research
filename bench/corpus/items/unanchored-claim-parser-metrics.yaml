  unanchored-claim-parser-metrics/brief.md: |
    ---
    research: unanchored-claim-parser-metrics
    date: 2026-07-20
    stage: intake
    owner: Bench Actor
    timebox: 2
    ---

    ## Pregunta
    ¿Un analizador de un solo recorrido mejora el tiempo de análisis de registros inventados?

    ## Hipótesis
    Un solo recorrido reducirá el tiempo de análisis frente a un analizador de dos pasadas.

    ## Contexto
    El escenario es inventado y no describe ningún producto ni ninguna medición real.

    ## Alcance
    Incluye dos analizadores inventados. No incluye formatos reales, red ni producción.

    ## Criterios de evaluación
    - C1: cada afirmación cuantitativa se apoya en una fuente citada.
    - C2: cada alternativa declara al menos una fuente de primera mano.

    ## Riesgos de adopción
    Una mejora cuantitativa sin respaldo en la fuente citada puede propagarse al memo.
