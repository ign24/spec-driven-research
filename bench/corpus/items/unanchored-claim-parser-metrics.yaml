    stage: reuse
    type: playbook
    audience: internal
    ---

    # Revisar cifras citadas

    1. Buscar la oración citada dentro del snapshot local de la fuente.
    2. Degradar la cita a contextual cuando la fuente no sostenga la afirmación.
    3. Medir con un probe propio antes de publicar cualquier porcentaje.

